[project]
name = "agente"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sebastian salinas", email = "st24030217@utlaguna.edu.mx" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
agente = "agente:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
