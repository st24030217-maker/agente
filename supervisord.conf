[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:fastapi]
directory=/app
command=/bin/bash -c "uvicorn agente.main:app --host 0.0.0.0 --port ${PORT:-8000}"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:whatsapp_bridge]
directory=/app/bridge
command=node index.js
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bridge.err.log
stdout_logfile=/var/log/supervisor/bridge.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
